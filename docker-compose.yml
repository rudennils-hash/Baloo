# Baloo lokal test-stack (Docker Compose)
# OBS: Produktion körs på Fly.io – se fly.toml i roten.

services:
  # ---------- CODE-SERVER (VS Code i webbläsaren) ----------
  codeserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: baloo-codeserver:latest
    container_name: codeserver
    ports:
      - "8080:8080"
    environment:
      # Sätt PASSWORD i .env eller i shell:  $env:PASSWORD="..." ; docker compose up
      - PASSWORD=${PASSWORD:-}
    volumes:
      - codeserver_data:/home/coder/.local
    restart: unless-stopped
    shm_size: 256m

  # ---------- GITEA (self-hosted Git) ----------
  gitea:
    image: gitea/gitea:1.22.4
    container_name: gitea
    ports:
      - "3000:3000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # ---------- MINIO (S3-kompatibel lagring) ----------
  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-baloo}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-baloo12345}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ---------- THE LOUNGE (IRC/webb-chat) ----------
  thelounge:
    image: thelounge/thelounge:v4.4.2
    container_name: thelounge
    ports:
      - "8081:9000"
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - thelounge_data:/var/opt/thelounge
    restart: unless-stopped

  # ---------- CADDY (reverse proxy, port 80 -> code-server) ----------
  caddy:
    image: caddy:2.8.0-alpine
    container_name: caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - codeserver
    restart: unless-stopped

volumes:
  codeserver_data:
  gitea_data:
  minio_data:
  thelounge_data:
  caddy_data:
  caddy_config:
