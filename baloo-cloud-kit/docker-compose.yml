version: "3.8"

services:
  code-server:
    image: codercom/code-server:latest
    container_name: baloo-code-server
    restart: unless-stopped
    ports:
      - "8443:8080"
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-baloo2026}
    volumes:
      - code-server-data:/home/coder/.local
      - ../:/workspace
    networks:
      - baloo-net

  gitea:
    image: gitea/gitea:latest
    container_name: baloo-gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - gitea-data:/data
    networks:
      - baloo-net

  minio:
    image: minio/minio:latest
    container_name: baloo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-baloo}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-baloo2026}
    volumes:
      - minio-data:/data
    networks:
      - baloo-net

  thelounge:
    image: thelounge/thelounge:latest
    container_name: baloo-thelounge
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - thelounge-data:/var/opt/thelounge
    networks:
      - baloo-net

  caddy:
    image: caddy:latest
    container_name: baloo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - baloo-net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: baloo-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - baloo-net

  grafana:
    image: grafana/grafana:latest
    container_name: baloo-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-baloo2026}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - baloo-net

  prometheus:
    image: prom/prometheus:latest
    container_name: baloo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - baloo-net

  loki:
    image: grafana/loki:latest
    container_name: baloo-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - baloo-net

volumes:
  code-server-data:
  gitea-data:
  minio-data:
  thelounge-data:
  caddy-data:
  caddy-config:
  portainer-data:
  grafana-data:
  prometheus-data:
  loki-data:

networks:
  baloo-net:
    driver: bridge
