app = "vgds"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.ports]]
    port = 80
    force_https = true

  [[http_service.ports]]
    port = 443

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# --- Persistent volym för settings + extensions (så de överlever omstart) ---
[[mounts]]
  source = "baloo_data"
  destination = "/home/coder/.local"